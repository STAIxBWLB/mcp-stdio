name: Check
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test
      - run: node -e 'const p = require("./package.json"); if (Object.keys(p.dependencies || {}).length || Object.keys(p.optionalDependencies || {}).length || Object.keys(p.peerDependencies || {}).length) throw new Error("runtime or peer dependencies are not allowed")'
      - run: bun scripts/check-pack.ts
