name: Check
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test
      - run: |
          node -e 'const p = require("./package.json"); const found = ["dependencies", "optionalDependencies", "peerDependencies"].flatMap(section => Object.keys(p[section] || {}).map(key => `${section}.${key}`)); if (found.length) throw new Error(`runtime or peer dependencies are not allowed: ${found.join(", ")}; remove them from package.json`)'
      - run: bun scripts/check-pack.ts
